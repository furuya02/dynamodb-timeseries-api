# Datasets that Grafana can query
# One dataset = "which table, which keys, and which attributes to return"
# Reference: docs/en/02-datasets.md (日本語: docs/ja/02-datasets.md)
# Draft from an existing table: pnpm init-dataset --table <table name>

datasets:
  # Sample: the table created by cdk deploy -c sample=true and the simulated sensor data loaded by pnpm seed
  # Partition key = room ID, sort key = epoch milliseconds
  room_temp:
    description: Temperature and humidity per room (sample)
    table: dynamodb-timeseries-api-sample
    partitionKey:
      name: deviceId
    sortKey:
      name: ts
      format: epoch_ms
    keys:
      pattern: "^room-[0-9]{2}$"
      # For the Grafana drop-down: list the id of the items whose partition key is devices
      list: { partitionValue: devices, attribute: id }
    fields:
      - { name: temperature, type: number, unit: celsius }
      - { name: humidity, type: number, unit: percent }
    limits:
      maxRange: 31d
      maxItems: 50000
    # Cold storage (read data older than 7 days from S3 + Athena). To use it, uncomment and deploy with -c cold=true
    # Reference: docs/en/09-cold-storage.md (日本語: docs/ja/09-cold-storage.md)
    # cold:
    #   hotRetention: 7d
    #   maxRange: 400d
